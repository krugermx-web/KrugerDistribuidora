<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Declinado | Tienda Krüger</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        'metallic-blue': '#002855',
                        'metallic-red': '#D31145'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8F9FA; }
        .animate-shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#F8F9FA] to-gray-200 h-screen flex flex-col justify-center items-center px-4">
    
    <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-md w-full border-t-8 border-metallic-red animate-shake">
        
        <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-red-100 shadow-inner">
            <i class="fas fa-times text-5xl text-metallic-red"></i>
        </div>
        
        <h1 class="text-3xl font-black text-gray-900 mb-4">Pago Declinado</h1>
        <p class="text-gray-500 mb-8 font-medium leading-relaxed">
            El banco ha rechazado la transacción por seguridad. <br>Por favor verifica que tus datos sean correctos o intenta con otra tarjeta.
        </p>
        
        <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-xl mb-8 flex items-start gap-3 text-left">
            <i class="fas fa-info-circle text-metallic-blue mt-1 text-lg"></i>
            <p class="text-sm text-gray-700 font-medium">Tranquilo, tu carrito de compras sigue guardado. Puedes volver a intentarlo sin perder tus productos.</p>
        </div>

        <a href="index.html" class="w-full bg-metallic-blue hover:bg-blue-900 text-white font-bold py-4 px-6 rounded-2xl block transition-all shadow-lg shadow-blue-900/30 transform hover:-translate-y-1 flex items-center justify-center gap-2">
            <i class="fas fa-redo-alt"></i> Volver a Intentar
        </a>
    </div>
    
</body>
</html>
