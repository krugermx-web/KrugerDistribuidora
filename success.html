<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! | Tienda Krüger</title>
    
    <!-- Tailwind y Fuentes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- LIBRERÍAS PROFESIONALES PARA GENERAR PDF NATIVO (NO CAPTURAS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { 'metallic-blue': '#002855', 'metallic-red': '#D31145' } } }
        }
    </script>
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FA] flex items-center justify-center min-h-screen p-4">

    <!-- TARJETA DE ÉXITO -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-lg w-full text-center border border-gray-100 relative overflow-hidden">
        
        <!-- Decoración de fondo -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500 rounded-full opacity-10 blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500 rounded-full opacity-10 blur-2xl"></div>

        <div class="relative z-10">
            <!-- Icono de éxito animado -->
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fas fa-check text-5xl text-green-500"></i>
            </div>
            
            <h1 class="text-4xl font-black text-metallic-blue mb-2">¡Pago Aprobado!</h1>
            <p class="text-gray-500 mb-8 text-lg">Tu pedido ha sido procesado correctamente. Hemos enviado un correo de confirmación con los detalles a tu bandeja de entrada.</p>
            
            <div class="bg-gray-50 rounded-2xl p-6 mb-8 border border-gray-100 text-left">
                <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">Importe Pagado</p>
                <p class="text-3xl font-black text-gray-900" id="monto-total">$0.00 MXN</p>
            </div>

            <div class="flex flex-col gap-4">
                <!-- BOTÓN PARA GENERAR PDF NATIVO -->
                <button onclick="generarPDF()" class="w-full bg-metallic-blue hover:bg-blue-900 text-white font-bold py-4 rounded-2xl text-lg transition-all shadow-lg flex justify-center items-center gap-3">
                    <i class="fas fa-file-pdf text-xl"></i> Descargar Recibo (PDF)
                </button>
                
                <a href="index.html" class="w-full bg-white border-2 border-gray-200 hover:border-metallic-blue hover:text-metallic-blue text-gray-600 font-bold py-4 rounded-2xl text-lg transition-all flex justify-center items-center gap-2 mt-2">
                    Volver a la Tienda
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE GENERACIÓN DE PDF -->
    <script>
        // Leer los datos que dejó el index.html en la memoria
        const ordenGuardada = JSON.parse(localStorage.getItem("ordenKruger"));

        // Al cargar la página, mostramos el total en la tarjeta
        document.addEventListener("DOMContentLoaded", () => {
            if (ordenGuardada && ordenGuardada.total) {
                document.getElementById('monto-total').innerText = `$${ordenGuardada.total.toLocaleString('es-MX')} MXN`;
            } else {
                // Si alguien entra directo a success.html sin comprar
                document.getElementById('monto-total').innerText = "Venta no encontrada";
            }
        });

        // ==========================================
        // CÓDIGO GENERADOR DE PDF NATIVO
        // ==========================================
        function generarPDF() {
            if (!ordenGuardada || !ordenGuardada.items) {
                alert("No se encontraron los detalles de la orden.");
                return;
            }

            // Inicializar jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Variables de cálculo (Desglose de IVA)
            const total = ordenGuardada.total;
            const subtotal = total / 1.16;
            const iva = total - subtotal;
            
            // Fecha actual
            const fechaActual = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });

            // 1. DIBUJAR ENCABEZADO
            doc.setFillColor(0, 40, 85); // Color Azul Metálico Krüger
            doc.rect(0, 0, 210, 40, 'F'); // Barra superior

            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(24);
            doc.text("KRÜGER", 14, 25);
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text("DISTRIBUIDOR AUTORIZADO", 14, 32);

            doc.setFontSize(16);
            doc.text("RECIBO DE COMPRA", 130, 25);
            doc.setFontSize(10);
            doc.text(`Fecha: ${fechaActual}`, 130, 32);

            // 2. DATOS DEL CLIENTE
            doc.setTextColor(50, 50, 50);
            doc.setFont("helvetica", "bold");
            doc.text("DATOS DE LA ORDEN", 14, 55);
            doc.setFont("helvetica", "normal");
            doc.text(`Correo del cliente: ${ordenGuardada.email || "No especificado"}`, 14, 62);
            doc.text(`Estado del pago: Aprobado (Mercado Pago)`, 14, 68);

            // 3. TABLA DE PRODUCTOS (Generada con AutoTable)
            const columnas = ["Cant.", "Descripción del Producto", "Incluye Instalación", "Precio Total"];
            const filas = [];

            ordenGuardada.items.forEach(item => {
                const totalItem = (item.price + (item.wantsInstall ? item.installPrice : 0)) * item.quantity;
                filas.push([
                    item.quantity.toString(),
                    item.name,
                    item.wantsInstall ? `Sí (+$${item.installPrice.toLocaleString('es-MX')})` : "No",
                    `$${totalItem.toLocaleString('es-MX')}`
                ]);
            });

            doc.autoTable({
                startY: 75,
                head: [columnas],
                body: filas,
                theme: 'striped',
                headStyles: { fillColor: [0, 40, 85], textColor: 255, fontStyle: 'bold' },
                styles: { fontSize: 10, cellPadding: 5 },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 20 },
                    2: { halign: 'center', cellWidth: 35 },
                    3: { halign: 'right', cellWidth: 35 }
                }
            });

            // 4. DIBUJAR TOTALES (Desglose de IVA)
            // Calculamos dónde terminó la tabla para poner los totales abajo
            const posicionY = doc.lastAutoTable.finalY + 15;

            doc.setFont("helvetica", "normal");
            doc.text("Subtotal (Sin IVA):", 130, posicionY);
            doc.text(`$${subtotal.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 196, posicionY, { align: "right" });

            doc.text("IVA (16%):", 130, posicionY + 7);
            doc.text(`$${iva.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 196, posicionY + 7, { align: "right" });

            // Línea separadora
            doc.setDrawColor(200, 200, 200);
            doc.line(130, posicionY + 11, 196, posicionY + 11);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("TOTAL PAGADO:", 130, posicionY + 19);
            doc.setTextColor(0, 40, 85);
            doc.text(`$${total.toLocaleString('es-MX')} MXN`, 196, posicionY + 19, { align: "right" });

            // 5. PIE DE PÁGINA
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Este es un comprobante de control interno generado automáticamente.", 105, 270, { align: "center" });
            doc.text("Gracias por confiar en la ingeniería alemana de Krüger.", 105, 275, { align: "center" });

            // DESCARGAR EL ARCHIVO PDF
            doc.save("Recibo_Kruger.pdf");
        }
    </script>
</body>
</html>
